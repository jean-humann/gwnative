[package]
name = "gwnative"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
description = "Native macOS host for the Guild Wars WebAssembly client"
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "gwnative"
path = "src/main.rs"

[dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
ureq = "3.3.0"
serde_json = { version = "1.0.151", features = ["std"] }
flate2 = "1.1.9"
sha2 = "0.11.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
security-framework = { version = "3", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
