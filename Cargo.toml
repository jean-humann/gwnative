[package]
name = "gwnative"
version = "0.1.8"
edition = "2024"
rust-version = "1.90"
description = "Unofficial native macOS host for the Guild Wars Reforged WebAssembly client"
license = "GPL-3.0-only"
# Read at compile time by `src/release.rs`, and the switch for two features
# rather than a note in a manifest: the Help menu's website item and the update
# check are both left out of a build that declares no repository, because an
# application that offers to show its project page and then shows nothing is
# worse than one with a shorter Help menu. Tags there are what the update check
# compares against, in the `vX.Y.Z` shapes `release::parse` accepts.
repository = "https://github.com/jean-humann/gwnative"
publish = false

[[bin]]
name = "gwnative"
path = "src/main.rs"

[dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
# Already in the tree as objc2-web-kit's dependency. Named here because the
# navigation delegate answers through a block and cannot avoid naming its type.
block2 = "0.6"
serde_json = { version = "1.0.151", features = ["std"] }
flate2 = "1.1.9"
sha2 = "0.11.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
# Already in the tree as objc2's dependency. Named here because the chunk store
# needs plain `fsync`, and every route to it in std is `F_FULLFSYNC` on macOS.
libc = "0.2"
base64 = { version = "0.23", default-features = false, features = ["std"] }
ed25519-compact = { version = "2.3.0", default-features = false, features = ["std"] }
wasmparser = { version = "0.252.0", default-features = false, features = ["std", "validate"] }
security-framework = { version = "3", default-features = false }
# Already in the tree underneath security-framework. Named here for one call it
# does not wrap — the switch that stops the keychain putting a password dialog
# on screen. See src/keychain.rs.
security-framework-sys = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Not `strip = "symbols"`. That made the shipped binary smaller and every
# release-build profile useless: `sample` and Instruments report raw addresses,
# so diagnosing a release-only regression meant rebuilding first, on a binary
# that is no longer the one that misbehaved. Keeping line tables in a separate
# .dSYM costs the shipped binary nothing and leaves something to symbolicate
# against.
debug = 1
split-debuginfo = "packed"
