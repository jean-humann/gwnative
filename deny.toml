[graph]
# Only the graph the application can ship. This avoids platform-only
# dependencies for unsupported targets influencing the policy.
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
# Unmaintained transitive crates are information; an unmaintained direct
# dependency is a choice this repository has to revisit.
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "GPL-2.0-or-later",
    "MIT",
    "Unicode-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
