# Sign before running. See scripts/signed-run for why the keychain needs it.
[target.aarch64-apple-darwin]
runner = "scripts/signed-run"

[env]
# The floor the Info.plist already declares, said again where the linker will
# hear it. rustc otherwise stamps LC_BUILD_VERSION with its own default of
# macOS 11. This is about the two numbers agreeing, and about `otool -l` being a
# usable answer to "what does this need"; JSPI is capability-probed at runtime
# and WebKit releases without it use the official Asyncify client.
MACOSX_DEPLOYMENT_TARGET = "15.2"
