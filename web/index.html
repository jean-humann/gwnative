<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guild Wars</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; color: #cdd6f4;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #canvas {
    display: block; width: 100%; height: 100%;
    outline: none; touch-action: none;
  }
  #status {
    position: fixed; inset: auto 0 0 0; padding: 10px 14px;
    display: flex; gap: 14px; align-items: baseline;
    background: rgba(0, 0, 0, .75); border-top: 1px solid #313244;
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  #status[hidden] { display: none; }
  #status-label { flex: 1; min-width: 0; }
  #status-detail { color: #9399b2; }
  /* Progress rail, sitting on the status bar's top border. */
  #bar {
    position: absolute; top: -1px; left: 0; right: 0; height: 3px;
    background: #181825; overflow: hidden;
  }
  #bar-fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #8a6a2b, #d9b25c 55%, #f3dd9d);
    transition: width .3s ease;
  }
  /* The client reports several boot stages with no total to divide by. A sweep
     says "working" without inventing a percentage none of them supply. */
  #bar.busy #bar-fill { width: 35%; animation: sweep 1.5s ease-in-out infinite; }
  @keyframes sweep {
    from { transform: translateX(-110%); }
    to { transform: translateX(320%); }
  }
  @media (prefers-reduced-motion: reduce) {
    #bar-fill { transition: none; }
    #bar.busy #bar-fill { animation: none; width: 100%; opacity: .5; }
  }
  /* Text-entry proxies, parked behind the canvas rather than hidden: the client
     calls focus() and gives up on text entirely if it does not take, and
     display:none cannot be focused. */
  .osk-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 40vh;
    padding-bottom: 60vh; z-index: -1;
    display: flex; align-items: center; justify-content: center;
  }
  .osk-input {
    width: 80%; font-size: 1.5rem; color: #fff;
    background: #404040; border: 2px solid #666; border-radius: 4px;
    outline: none; resize: none;
  }
  #log {
    position: fixed; inset: 0 0 auto 0; max-height: 60%;
    margin: 0; padding: 10px 14px; overflow: auto;
    background: rgba(0, 0, 0, .85); border-bottom: 1px solid #313244;
    font-family: ui-monospace, "JetBrainsMono Nerd Font Mono", monospace;
    font-size: 11px; white-space: pre-wrap; display: none;
  }
</style>

<canvas id="canvas" tabindex="0" autofocus></canvas>
<div id="status">
  <div id="bar" class="busy"><div id="bar-fill"></div></div>
  <span id="status-label">Starting…</span>
  <span id="status-detail"></span>
</div>
<!-- The client probes for Module.oskInput and concludes it cannot accept text at
     all if these are missing — which is why the login fields ignored every key.
     It focuses them itself, hence tabindex=-1. The game owns editing, so the
     browser's writing assistance must not rewrite its input event stream. -->
<div class="osk-container">
  <input type="text" id="osk-input-text" class="osk-input" tabindex="-1"
         enterkeyhint="enter" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" writingsuggestions="false">
</div>
<div class="osk-container">
  <input type="email" id="osk-input-email" class="osk-input" tabindex="-1"
         enterkeyhint="enter" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" writingsuggestions="false">
</div>
<div class="osk-container">
  <input type="password" id="osk-input-password" class="osk-input" tabindex="-1"
         autocomplete="off" autocorrect="off" autocapitalize="off"
         spellcheck="false" writingsuggestions="false">
</div>
<div class="osk-container">
  <input type="number" id="osk-input-number" class="osk-input" tabindex="-1"
         enterkeyhint="enter" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" writingsuggestions="false">
</div>
<div class="osk-container">
  <textarea id="osk-input-multiline" class="osk-input" rows="3" tabindex="-1"
            autocomplete="off" autocorrect="off" autocapitalize="off"
            spellcheck="false" writingsuggestions="false"></textarea>
</div>

<pre id="log"></pre>

<!-- Classic script, not a module: the generated glue declares `var Module`, so
     the harness has to share that top-level scope. -->
<script src="harness.js"></script>
