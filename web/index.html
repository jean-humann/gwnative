<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guild Wars</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; color: #cdd6f4;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #canvas {
    display: block; width: 100%; height: 100%;
    outline: none; touch-action: none;
  }
  /* Pointer lock already hides the cursor, but a right-drag re-anchors by
     releasing and re-pressing, and the cursor flickers back in that gap. */
  #canvas.cursor-hidden { cursor: none !important; }
  #status {
    position: fixed; inset: auto 0 0 0; padding: 10px 14px;
    display: flex; gap: 14px; align-items: baseline;
    background: rgba(0, 0, 0, .75); border-top: 1px solid #313244;
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  #status[hidden] { display: none; }
  #status-label { flex: 1; min-width: 0; }
  #status-detail { color: #9399b2; }
  /* Progress rail, sitting on the status bar's top border. */
  #bar {
    position: absolute; top: -1px; left: 0; right: 0; height: 3px;
    background: #181825; overflow: hidden;
  }
  #bar-fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #8a6a2b, #d9b25c 55%, #f3dd9d);
    transition: width .3s ease;
  }
  /* The client reports several boot stages with no total to divide by. A sweep
     says "working" without inventing a percentage none of them supply. */
  #bar.busy #bar-fill { width: 35%; animation: sweep 1.5s ease-in-out infinite; }
  @keyframes sweep {
    from { transform: translateX(-110%); }
    to { transform: translateX(320%); }
  }
  @media (prefers-reduced-motion: reduce) {
    #bar-fill { transition: none; }
    #bar.busy #bar-fill { animation: none; width: 100%; opacity: .5; }
  }
  /* Text-entry proxies, parked behind the canvas rather than hidden: the client
     calls focus() and gives up on text entirely if it does not take, and
     display:none cannot be focused. */
  .osk-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 40vh;
    padding-bottom: 60vh; z-index: -1;
    display: flex; align-items: center; justify-content: center;
  }
  .osk-input {
    width: 80%; font-size: 1.5rem; color: #fff;
    background: #404040; border: 2px solid #666; border-radius: 4px;
    outline: none; resize: none;
  }
  /* Failure overlay. A boot that has failed is over, so unlike #status this
     takes pointer events and covers the canvas — there is nothing behind it
     worth clicking. */
  #failure {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    padding: 40px; text-align: center;
    background: rgba(0, 0, 0, .92);
  }
  #failure[hidden] { display: none; }
  #failure-text { max-width: 46em; color: #f38ba8; }
  #failure-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #failure button {
    padding: 7px 16px; border-radius: 6px; cursor: pointer;
    font: inherit; color: #cdd6f4;
    background: #313244; border: 1px solid #45475a;
  }
  #failure button:hover { background: #45475a; }
  #failure button.danger { color: #f38ba8; }
  #failure-note { color: #9399b2; max-width: 46em; min-height: 1.5em; }
  /* Launcher overlay. Same shape as #failure — it covers the canvas and takes
     pointer events for the same reason: the client does not exist yet, so
     there is nothing behind it. Wired by launcher.js. */
  #launcher {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    padding: 40px; text-align: center;
    background: rgba(0, 0, 0, .92);
  }
  #launcher[hidden] { display: none; }
  #launcher-title { margin: 0; font-size: 20px; font-weight: 500; }
  #launcher-text { max-width: 42em; color: #9399b2; }
  #launcher-detail { color: #9399b2; min-height: 1.5em; font-variant-numeric: tabular-nums; }
  #launcher-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #launcher button {
    padding: 7px 16px; border-radius: 6px; cursor: pointer;
    font: inherit; color: #cdd6f4;
    background: #313244; border: 1px solid #45475a;
  }
  #launcher button:hover { background: #45475a; }
  #launcher button.primary { border-color: #d9b25c; }
  /* Wider than the status rail because here it is the subject, not a footnote. */
  #launcher-rail {
    width: min(32em, 70vw); height: 6px; border-radius: 3px;
    background: #181825; overflow: hidden;
  }
  #launcher-rail[hidden] { display: none; }
  #launcher-rail-fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #8a6a2b, #d9b25c 55%, #f3dd9d);
    transition: width .3s ease;
  }
  @media (prefers-reduced-motion: reduce) { #launcher-rail-fill { transition: none; } }
  /* Settings panel. Same overlay shape as #launcher and #failure, but this one
     covers a game that is still running, so it is dimmer rather than opaque and
     Escape gives focus back to the canvas. */
  #settings {
    position: fixed; inset: 0; z-index: 3;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    padding: 40px; background: rgba(0, 0, 0, .8);
  }
  #settings[hidden] { display: none; }
  #settings-title { margin: 0; font-size: 20px; font-weight: 500; }
  #settings-rows {
    display: grid; grid-template-columns: auto 1fr; gap: 12px 16px;
    align-items: baseline;
    width: min(38em, 80vw); padding: 20px 22px;
    background: rgba(24, 24, 37, .92);
    border: 1px solid #313244; border-radius: 10px;
  }
  .settings-row { display: contents; }
  .settings-row label { justify-self: end; color: #cdd6f4; }
  .settings-row select {
    font: inherit; color: #cdd6f4; padding: 4px 8px; border-radius: 6px;
    background: #313244; border: 1px solid #45475a;
  }
  /* Spans both columns under the row it explains, so a long note does not
     stretch the control column. */
  .settings-hint {
    grid-column: 2; color: #9399b2; font-size: 12px; margin: -6px 0 4px;
  }
  .settings-hint:empty { display: none; }
  /* Amber rather than the red below it: something is missing, nothing is
     wrong, and the two should not look the same. */
  #settings-compat {
    color: #d9b25c; max-width: 38em; text-align: center; font-size: 13px; line-height: 1.5;
  }
  #settings-compat[hidden] { display: none; }
  #settings-note { color: #f38ba8; min-height: 1.5em; max-width: 38em; text-align: center; }
  #settings-actions { display: flex; gap: 10px; }
  #settings button {
    padding: 7px 16px; border-radius: 6px; cursor: pointer;
    font: inherit; color: #cdd6f4;
    background: #313244; border: 1px solid #45475a;
  }
  #settings button:hover { background: #45475a; }
  #settings button.primary { border-color: #d9b25c; }
  #log {
    position: fixed; inset: 0 0 auto 0; max-height: 60%;
    margin: 0; padding: 10px 14px; overflow: auto;
    background: rgba(0, 0, 0, .85); border-bottom: 1px solid #313244;
    font-family: ui-monospace, "JetBrainsMono Nerd Font Mono", monospace;
    font-size: 11px; white-space: pre-wrap; display: none;
  }
</style>

<canvas id="canvas" tabindex="0" autofocus></canvas>
<div id="status">
  <div id="bar" class="busy"><div id="bar-fill"></div></div>
  <span id="status-label">Starting…</span>
  <span id="status-detail"></span>
</div>
<!-- Filled in by loading.js. Present in the markup rather than built at failure
     time because the failure may well be that a module could not be loaded. -->
<div id="failure" hidden>
  <div id="failure-text"></div>
  <div id="failure-actions"></div>
  <div id="failure-note"></div>
</div>
<!-- Filled in by launcher.js, which asks how the game image should be fetched
     before the client is built. Markup rather than a built fragment so the
     styling above stays with the rest of it. -->
<div id="launcher" hidden>
  <h1 id="launcher-title"></h1>
  <div id="launcher-text"></div>
  <div id="launcher-rail" hidden><div id="launcher-rail-fill"></div></div>
  <div id="launcher-detail"></div>
  <div id="launcher-actions"></div>
</div>
<!-- Filled in by settings-panel.js, opened from the Settings… menu item. The
     rows are built rather than written out because the panel's contents are a
     table in that file, and two lists that have to agree is one list too many. -->
<div id="settings" hidden>
  <h1 id="settings-title">Settings</h1>
  <div id="settings-compat" hidden></div>
  <div id="settings-rows"></div>
  <div id="settings-note"></div>
  <div id="settings-actions"></div>
</div>
<!-- The client probes for Module.oskInput and concludes it cannot accept text at
     all if these are missing — which is why the login fields ignored every key.
     It focuses them itself, hence tabindex=-1. The game owns editing, so the
     browser's writing assistance must not rewrite its input event stream. -->
<div class="osk-container">
  <input type="text" id="osk-input-text" class="osk-input" tabindex="-1"
         enterkeyhint="enter" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" writingsuggestions="false">
</div>
<div class="osk-container">
  <input type="email" id="osk-input-email" class="osk-input" tabindex="-1"
         enterkeyhint="enter" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" writingsuggestions="false">
</div>
<div class="osk-container">
  <input type="password" id="osk-input-password" class="osk-input" tabindex="-1"
         autocomplete="off" autocorrect="off" autocapitalize="off"
         spellcheck="false" writingsuggestions="false">
</div>
<div class="osk-container">
  <input type="number" id="osk-input-number" class="osk-input" tabindex="-1"
         enterkeyhint="enter" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" writingsuggestions="false">
</div>
<div class="osk-container">
  <textarea id="osk-input-multiline" class="osk-input" rows="3" tabindex="-1"
            autocomplete="off" autocorrect="off" autocapitalize="off"
            spellcheck="false" writingsuggestions="false"></textarea>
</div>

<pre id="log"></pre>

<!-- Classic script, not a module: the generated glue declares `var Module`, so
     the harness has to share that top-level scope. -->
<script src="harness.js"></script>
