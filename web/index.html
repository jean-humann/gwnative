<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guild Wars</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; color: #cdd6f4;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #canvas {
    display: block; width: 100%; height: 100%;
    outline: none; touch-action: none;
  }
  /* Pointer lock already hides the cursor, but a right-drag re-anchors by
     releasing and re-pressing, and the cursor flickers back in that gap. */
  #canvas.cursor-hidden { cursor: none !important; }
  #status {
    position: fixed; inset: auto 0 0 0; padding: 10px 14px;
    display: flex; gap: 14px; align-items: baseline;
    background: rgba(0, 0, 0, .75); border-top: 1px solid #313244;
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  #status[hidden] { display: none; }
  #status-label { flex: 1; min-width: 0; }
  #status-detail { color: #9399b2; }
  /* Progress rail, sitting on the status bar's top border. */
  #bar {
    position: absolute; top: -1px; left: 0; right: 0; height: 3px;
    background: #181825; overflow: hidden;
  }
  #bar-fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #8a6a2b, #d9b25c 55%, #f3dd9d);
    transition: width .3s ease;
  }
  /* The client reports several boot stages with no total to divide by. A sweep
     says "working" without inventing a percentage none of them supply. */
  #bar.busy #bar-fill { width: 35%; animation: sweep 1.5s ease-in-out infinite; }
  @keyframes sweep {
    from { transform: translateX(-110%); }
    to { transform: translateX(320%); }
  }
  @media (prefers-reduced-motion: reduce) {
    #bar-fill { transition: none; }
    #bar.busy #bar-fill { animation: none; width: 100%; opacity: .5; }
  }
  /* Text-entry proxies, parked behind the canvas rather than hidden: the client
     calls focus() and gives up on text entirely if it does not take, and
     display:none cannot be focused. */
  .osk-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 40vh;
    padding-bottom: 60vh; z-index: -1;
    display: flex; align-items: center; justify-content: center;
  }
  .osk-input {
    width: 80%; font-size: 1.5rem; color: #fff;
    background: #404040; border: 2px solid #666; border-radius: 4px;
    outline: none; resize: none;
  }
  /* Failure overlay. A boot that has failed is over, so unlike #status this
     takes pointer events and covers the canvas — there is nothing behind it
     worth clicking. */
  #failure {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    padding: 40px; text-align: center;
    background: rgba(0, 0, 0, .92);
  }
  #failure[hidden] { display: none; }
  #failure-text { max-width: 46em; color: #f38ba8; }
  #failure-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #failure button {
    padding: 7px 16px; border-radius: 6px; cursor: pointer;
    font: inherit; color: #cdd6f4;
    background: #313244; border: 1px solid #45475a;
  }
  #failure button:hover { background: #45475a; }
  #failure button.danger { color: #f38ba8; }
  #failure-note { color: #9399b2; max-width: 46em; min-height: 1.5em; }
  /* Launcher overlay. Same shape as #failure — it covers the canvas and takes
     pointer events for the same reason: the client does not exist yet, so
     there is nothing behind it. Wired by launcher.js. */
  #launcher {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    padding: 40px; text-align: center;
    background: rgba(0, 0, 0, .92);
  }
  #launcher[hidden] { display: none; }
  #launcher-title { margin: 0; font-size: 20px; font-weight: 500; }
  #launcher-text { max-width: 42em; color: #9399b2; }
  #launcher-detail { color: #9399b2; min-height: 1.5em; font-variant-numeric: tabular-nums; }
  #launcher-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #launcher button {
    padding: 7px 16px; border-radius: 6px; cursor: pointer;
    font: inherit; color: #cdd6f4;
    background: #313244; border: 1px solid #45475a;
  }
  #launcher button:hover { background: #45475a; }
  #launcher button.primary { border-color: #d9b25c; }
  /* Same red as the failure overlay's. Stopping a download and clearing the
     cache are the two buttons in this app that throw work away, and they should
     not look like the ones beside them. */
  #launcher button.danger { color: #f38ba8; }
  /* Wider than the status rail because here it is the subject, not a footnote. */
  #launcher-rail {
    width: min(32em, 70vw); height: 6px; border-radius: 3px;
    background: #181825; overflow: hidden;
  }
  #launcher-rail[hidden] { display: none; }
  #launcher-rail-fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #8a6a2b, #d9b25c 55%, #f3dd9d);
    transition: width .3s ease;
  }
  @media (prefers-reduced-motion: reduce) { #launcher-rail-fill { transition: none; } }
  /* Settings panel. Same dim-over-a-running-game shape as before, but the panel
     is now one bounded dialog rather than a stack of cards centred in the
     viewport.

     The old shape could not survive a small window. A centred column overflows
     in both directions, and the half that goes off the top of a viewport is not
     merely clipped — it cannot be scrolled to, because the overflow is on the
     viewport and the viewport has nowhere to scroll. At 715px tall the title and
     the first setting were both gone and neither could be reached. Bounding the
     dialog to the viewport and scrolling *inside* it is what makes every control
     reachable at any window size; the tabs are what stop it needing to scroll at
     the sizes anyone actually plays at. */
  #settings {
    position: fixed; inset: 0; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(8px, 4vmin, 40px); background: rgba(0, 0, 0, .8);
  }
  #settings[hidden] { display: none; }
  #settings-dialog {
    display: flex; flex-direction: column;
    width: min(40em, 100%); max-height: 100%;
    background: rgba(24, 24, 37, .94);
    border: 1px solid #313244; border-radius: 10px;
  }
  /* Head and foot hold their size; only the body between them scrolls, so the
     tabs and the Save button are never the thing that scrolled away. */
  #settings-head {
    flex: none; padding: 14px 18px 0; border-bottom: 1px solid #313244;
  }
  #settings-title { margin: 0 0 10px; font-size: 20px; font-weight: 500; }
  #settings-tabs { display: flex; flex-wrap: wrap; gap: 2px; }
  #settings-tabs[hidden] { display: none; }
  #settings-tabs button {
    padding: 7px 13px; border: 0; border-bottom: 2px solid transparent;
    border-radius: 6px 6px 0 0; background: none; color: #9399b2;
    font: inherit; cursor: pointer;
  }
  #settings-tabs button:hover { color: #cdd6f4; background: rgba(49, 50, 68, .6); }
  #settings-tabs button[aria-selected="true"] {
    color: #f3dd9d; border-bottom-color: #d9b25c;
  }
  #settings-body {
    /* `min-height: 0` because a flex item defaults to min-content and would
       refuse to shrink below its rows, pushing the foot off the bottom instead
       of scrolling. */
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 16px 18px; display: flex; flex-direction: column; gap: 14px;
  }
  #settings-rows {
    display: grid; grid-template-columns: auto 1fr; gap: 12px 16px;
    align-items: baseline;
  }
  .settings-row { display: contents; }
  /* `hidden` has to beat `display: contents`, or a row belonging to another tab
     still draws. */
  .settings-row[hidden] { display: none; }
  .settings-row label { justify-self: end; color: #cdd6f4; }
  .settings-row select {
    font: inherit; color: #cdd6f4; padding: 4px 8px; border-radius: 6px;
    background: #313244; border: 1px solid #45475a; max-width: 100%;
  }
  /* Spans both columns under the row it explains, so a long note does not
     stretch the control column. */
  .settings-hint {
    grid-column: 2; color: #9399b2; font-size: 12px; margin: -6px 0 4px;
  }
  .settings-hint:empty { display: none; }
  /* Under about 34em the label column and a select cannot both have room, so
     the form becomes one column and the labels move above their controls. */
  @media (max-width: 34em) {
    #settings-rows { grid-template-columns: 1fr; }
    .settings-row label { justify-self: start; }
    .settings-hint { grid-column: 1; margin-top: -8px; }
  }
  /* Amber rather than the red below it: something is missing, nothing is
     wrong, and the two should not look the same. */
  #settings-compat, #settings-pending {
    color: #d9b25c; font-size: 13px; line-height: 1.5; text-align: center;
  }
  #settings-compat[hidden], #settings-pending[hidden] { display: none; }
  #settings-note { color: #f38ba8; text-align: center; }
  /* Takes no room until it has something to say. It used to reserve a line
     against layout jumping, which is a fair trade in a panel with space to
     spare and the wrong one in a panel bounded by a small window. */
  #settings-note:empty { display: none; }
  /* The game image keeps its own card inside the tab that owns it: what it
     offers is not a preference and is not undone by Cancel. */
  #settings-data {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding: 12px 14px; border: 1px solid #313244; border-radius: 8px;
    background: rgba(17, 17, 27, .55);
  }
  #settings-data[hidden] { display: none; }
  #settings-data-line {
    color: #9399b2; font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums;
  }
  #settings-data-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  #settings-foot {
    flex: none; padding: 12px 18px; border-top: 1px solid #313244;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  #settings-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  /* Named containers rather than `#settings button`, which has the same
     specificity as the tab rules above and, being later, would take their
     borders and background back. */
  #settings-actions button, #settings-data-actions button {
    padding: 7px 16px; border-radius: 6px; cursor: pointer;
    font: inherit; color: #cdd6f4;
    background: #313244; border: 1px solid #45475a;
  }
  #settings-actions button:hover, #settings-data-actions button:hover { background: #45475a; }
  #settings-actions button.primary { border-color: #d9b25c; }
  #settings-actions button.danger, #settings-data-actions button.danger { color: #f38ba8; }
  /* User guide. Reading rather than deciding, so it is the one overlay that
     scrolls and the only one whose text is left-aligned. */
  #guide {
    position: fixed; inset: 0; z-index: 3;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    padding: 40px; background: rgba(0, 0, 0, .8);
  }
  #guide[hidden] { display: none; }
  #guide-title { margin: 0; font-size: 20px; font-weight: 500; }
  #guide-body {
    width: min(44em, 86vw); max-height: min(60vh, 40em); overflow-y: auto;
    padding: 4px 26px 18px; color: #cdd6f4;
    background: rgba(24, 24, 37, .92);
    border: 1px solid #313244; border-radius: 10px;
  }
  #guide-body h2 { margin: 22px 0 8px; font-size: 15px; font-weight: 500; color: #d9b25c; }
  #guide-body p { margin: 0 0 10px; color: #9399b2; font-size: 13px; line-height: 1.6; }
  #guide-actions { display: flex; gap: 10px; }
  #guide button {
    padding: 7px 16px; border-radius: 6px; cursor: pointer;
    font: inherit; color: #cdd6f4;
    background: #313244; border: 1px solid #45475a;
  }
  #guide button:hover { background: #45475a; }
  #guide button.primary { border-color: #d9b25c; }
  #log {
    position: fixed; inset: 0 0 auto 0; max-height: 60%;
    margin: 0; padding: 10px 14px; overflow: auto;
    background: rgba(0, 0, 0, .85); border-bottom: 1px solid #313244;
    font-family: ui-monospace, "JetBrainsMono Nerd Font Mono", monospace;
    font-size: 11px; white-space: pre-wrap; display: none;
  }
</style>

<canvas id="canvas" tabindex="0" autofocus></canvas>
<div id="status">
  <div id="bar" class="busy"><div id="bar-fill"></div></div>
  <span id="status-label">Starting…</span>
  <span id="status-detail"></span>
</div>
<!-- Filled in by loading.js. Present in the markup rather than built at failure
     time because the failure may well be that a module could not be loaded. -->
<div id="failure" hidden>
  <div id="failure-text"></div>
  <div id="failure-actions"></div>
  <div id="failure-note"></div>
</div>
<!-- Filled in by launcher.js, which asks how the game image should be fetched
     before the client is built. Markup rather than a built fragment so the
     styling above stays with the rest of it. -->
<div id="launcher" hidden>
  <h1 id="launcher-title"></h1>
  <div id="launcher-text"></div>
  <div id="launcher-rail" hidden><div id="launcher-rail-fill"></div></div>
  <div id="launcher-detail"></div>
  <div id="launcher-actions"></div>
</div>
<!-- Filled in by settings-panel.js, opened from the Settings… menu item. The
     rows and the tabs are built rather than written out because the panel's
     contents are a table in that file, and two lists that have to agree is one
     list too many. -->
<div id="settings" hidden>
  <div id="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div id="settings-head">
      <h1 id="settings-title">Settings</h1>
      <div id="settings-tabs" role="tablist" aria-label="Settings sections"></div>
    </div>
    <div id="settings-body">
      <div id="settings-compat" hidden></div>
      <div id="settings-rows"></div>
      <div id="settings-data" hidden>
        <div id="settings-data-line"></div>
        <div id="settings-data-actions"></div>
      </div>
    </div>
    <div id="settings-foot">
      <div id="settings-pending" hidden></div>
      <div id="settings-note"></div>
      <div id="settings-actions"></div>
    </div>
  </div>
</div>
<!-- Filled in by guide.js, opened from Help → User Guide. In the app rather
     than on a website because a Help menu that needs the network answers last
     when it is needed most. -->
<div id="guide" hidden>
  <h1 id="guide-title">Guild Wars on this Mac</h1>
  <div id="guide-body"></div>
  <div id="guide-actions"></div>
</div>
<!-- The client probes for Module.oskInput and concludes it cannot accept text at
     all if these are missing — which is why the login fields ignored every key.
     It focuses them itself, hence tabindex=-1. The game owns editing, so the
     browser's writing assistance must not rewrite its input event stream. -->
<div class="osk-container">
  <input type="text" id="osk-input-text" class="osk-input" tabindex="-1"
         enterkeyhint="enter" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" writingsuggestions="false">
</div>
<div class="osk-container">
  <input type="email" id="osk-input-email" class="osk-input" tabindex="-1"
         enterkeyhint="enter" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" writingsuggestions="false">
</div>
<div class="osk-container">
  <input type="password" id="osk-input-password" class="osk-input" tabindex="-1"
         autocomplete="off" autocorrect="off" autocapitalize="off"
         spellcheck="false" writingsuggestions="false">
</div>
<div class="osk-container">
  <input type="number" id="osk-input-number" class="osk-input" tabindex="-1"
         enterkeyhint="enter" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" writingsuggestions="false">
</div>
<div class="osk-container">
  <textarea id="osk-input-multiline" class="osk-input" rows="3" tabindex="-1"
            autocomplete="off" autocorrect="off" autocapitalize="off"
            spellcheck="false" writingsuggestions="false"></textarea>
</div>

<pre id="log"></pre>

<!-- Classic script, not a module: the generated glue declares `var Module`, so
     the harness has to share that top-level scope. -->
<script src="harness.js"></script>
