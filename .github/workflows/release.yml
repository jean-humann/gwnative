# Publish a signed, notarized disk image for a tag.
#
# This runs the same scripts/release that runs locally, unmodified. That is the
# design: a release path only exercised by CI is one nobody can reproduce when
# it breaks, and a local one that CI works around is one CI is not testing. What
# the steps below do is build the environment that script already expects — a
# keychain holding a Developer ID identity and a notarytool credential profile —
# and then get out of the way.
#
# On the secrets, and why this job is gated
# -----------------------------------------
# This is a public repository, and the identity it signs with is not this
# project's alone: a Developer ID certificate signs everything its owner ships.
# Two things follow, and both are load-bearing rather than ceremony.
#
# The `environment: release` line means the secrets are unreachable until
# somebody approves the run — configure required reviewers on that environment
# or it is decoration. Without it, anyone who can land a commit that changes a
# workflow file can read every secret here, and on a public repository that
# blast radius reaches well past this application.
#
# And nothing third-party runs in this job. actions/checkout is GitHub's own;
# there is no cache action, no toolchain action, no release action, because each
# would be someone else's code executing in a process that can read a signing
# key. The cache is worth roughly two minutes a release and is not worth that.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # For re-cutting a release whose upload failed after notarization
      # succeeded. Empty means whatever ref the run was dispatched from, which
      # is what a dry run wants.
      tag:
        description: The existing tag to build (blank for the current ref)
        required: false
      # Everything except the publish. The point is that the half of this
      # workflow which cannot be tested locally — importing a certificate into a
      # keychain that has never held one, and Apple actually accepting the
      # result — is exercised without an irreversible public release at the end
      # of it. A signing pipeline whose first real run is also its first
      # publication is one where the notarization log arrives too late to be
      # useful.
      dry_run:
        description: Build and notarize, but publish nothing
        type: boolean
        default: false

permissions:
  # To create the release and upload the disk image to it. Nothing else — the
  # default token grants far more, and this job needs none of it.
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    # The approval gate. See the note at the top of this file.
    environment: release
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # scripts/bundle takes CFBundleVersion from the commit count, and a
          # published build is the one place that number has to be right.
          fetch-depth: 0

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # A keychain that exists for this job and is deleted with it, holding both
      # the signing identity and the notarization credentials. Made the default
      # so that scripts/sign-identity and notarytool find them the same way they
      # do on a developer's machine — that is what lets the script run unchanged.
      - name: Unlock a keychain for this run
        env:
          # Named exactly as they are in the GitLab project these came from, so
          # moving one is a copy and never a rename.
          APPLE_DEVELOPER_ID_APPLICATION_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_ISSUER: ${{ secrets.APPLE_NOTARY_KEY_ISSUER }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail

          # Never a secret and never reused: the keychain is destroyed at the end
          # of the job, so its password only has to survive these steps.
          keychain_password=$(openssl rand -base64 24)
          keychain=$RUNNER_TEMP/release.keychain-db

          security create-keychain -p "$keychain_password" "$keychain"
          # Without this the keychain relocks on a timer and a build long enough
          # to outlast it fails at the signing step with an error that says
          # nothing about time. Notarization is a wait on somebody else's queue,
          # so the timer is set well past anything this job should take.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          # Prepended to the existing list rather than replacing it: the search
          # list is how `security find-identity` is reached at all, since unlike
          # codesign it has no way to be pointed at a keychain path.
          existing=$(security list-keychains -d user | sed -e 's/"//g' | xargs)
          # Deliberately unquoted: -s takes each path as its own argument.
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing

          # -A is deliberately absent: the key is usable by codesign and by
          # nothing else, so a later step in this job cannot read it out.
          p12=$RUNNER_TEMP/certificate.p12
          printf '%s' "$APPLE_DEVELOPER_ID_APPLICATION_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign -f pkcs12
          rm -f "$p12"

          # The link from the leaf to the Apple Root the system already trusts.
          # A keychain built from nothing has no intermediates, and without them
          # the identity is present but untrusted — see packaging/certs/README.md.
          #
          # A .p12 export may or may not carry the chain alongside the leaf,
          # depending on what the person exporting it ticked. When it does, this
          # is importing a certificate that is already there, and `security`
          # calls that an error. It is not one — the keychain is in exactly the
          # state the next line wants — so that single case is tolerated and
          # every other failure still stops the job.
          for ca in packaging/certs/*.cer; do
            if ! out=$(security import "$ca" -k "$keychain" -t cert 2>&1); then
              case $out in
                *"already exists"*) echo "${ca##*/}: already in the keychain" ;;
                *) echo "$out" >&2; exit 1 ;;
              esac
            fi
          done

          # Stops the "codesign wants to access key" prompt that has nobody to
          # answer it on a runner, and hangs the job until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null

          # Unconditional, and worth the four lines: `find-identity` without -v
          # lists what is there along with any trust error, and with -v lists
          # only what is chain-valid. The difference between the two is the
          # whole diagnosis when signing fails, and it cannot be recovered after
          # the job has deleted the keychain.
          security find-identity "$keychain" || true
          security find-identity -v -p codesigning "$keychain" || true

          # An App Store Connect API key rather than an Apple ID and an
          # app-specific password: it carries only the Developer-ID role, it is
          # revocable on its own, and it is not somebody's account login.
          #
          # Stored under the profile name scripts/release defaults to, in the
          # keychain that is now the default one, so that script's own preflight
          # finds it exactly as it does on a developer's Mac.
          p8=$RUNNER_TEMP/notary.p8
          printf '%s' "$APPLE_NOTARY_KEY_P8" | base64 --decode > "$p8"
          xcrun notarytool store-credentials gwnative \
            --key "$p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_KEY_ISSUER" \
            --keychain "$keychain"
          rm -f "$p8"

          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # Unmodified, and that is the point. Everything it checks — a Developer ID
      # rather than a development certificate, working credentials, a clean
      # tree, a hardened runtime, a real timestamp, a ticket that staples — it
      # checks here too.
      - name: Build, sign, notarize and package
        run: scripts/release

      # Unmodified as well, for the same reason. It creates the release as a
      # draft, renders its notes, signs the archive Sparkle will download,
      # builds the feed and only then makes any of it visible — see the note at
      # the top of scripts/publish.
      #
      # SPARKLE_PRIVATE_KEY is the one secret here that is this project's alone,
      # and it is the one that cannot be rotated quietly: it is the private half
      # of the key compiled into every copy already installed, so replacing it
      # means every one of them stops accepting updates until its owner installs
      # a build by hand. Unset is survivable — scripts/appcast fails, the
      # release is left a draft, and nothing has been published wrong.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: scripts/publish "$TAG"

      # A dry run that says nothing looks the same as one that did nothing.
      # This prints what the publish would have uploaded, and re-reads the
      # finished image rather than the log: `stapler validate` on the DMG is the
      # end-to-end answer, because a ticket only staples to something Apple
      # actually issued one for.
      - name: What a real run would have published
        if: ${{ inputs.dry_run }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          dmg="dist/gwnative-$version.dmg"
          zip="dist/gwnative-$version.zip"

          # The half of the update path a dry run can actually exercise: that
          # the secret is present, that sign_update accepts it, and — the part
          # worth the step — that what it produces verifies against the public
          # key this build was compiled with. A release signed by the wrong key
          # is accepted by GitHub, looks correct on the page, and is refused by
          # every installed copy without a word. Better to find out here.
          built=ok
          scripts/appcast "$zip" > dist/appcast.log 2>&1 || built=failed

          {
            echo "### Dry run — nothing was published"
            echo
            echo "A real run would have created release \`v$version\` from"
            echo "\`$dmg\` ($(du -h "$dmg" | cut -f1)) and"
            echo "\`$zip\` ($(du -h "$zip" | cut -f1)), plus the update feed."
            echo
            echo '```'
            xcrun stapler validate "$dmg" 2>&1
            spctl --assess --type open --context context:primary-signature \
              --verbose=2 "$dmg" 2>&1 || true
            echo "update feed: $built"
            cat dist/appcast.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$built" = ok ] || exit 1

      # Always, including after a failure: a keychain holding a signing identity
      # should not outlive the job that needed it, and a cancelled run is
      # exactly when it would.
      - name: Take the keychain away again
        if: always()
        run: |
          security delete-keychain "$RELEASE_KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"
