name: macOS 27 canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-27-canary-${{ github.sha }}
  cancel-in-progress: false

jobs:
  canary:
    # GitHub publishes no hosted macOS 27 image. This label identifies an
    # administrator-enrolled Apple Silicon machine; the environment supplies
    # the separate human authorization. The job deliberately receives no
    # secrets and performs no client download or gameplay automation.
    runs-on: [self-hosted, macOS, ARM64, gwnative-macos-27]
    environment: macos-27-canary
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prove the authorized host
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          major=$(sw_vers -productVersion | cut -d. -f1)
          test "$major" -ge 27

      - name: Validate the declared evidence cells
        run: scripts/check-support-matrix

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Native deterministic suite
        run: cargo test --locked

      - name: Automatic JSPI and forced Asyncify fresh-realm probes
        run: |
          node --test web/client-runtime.test.js
          swift scripts/webkit-runtime-probe.swift --require-jspi

      - name: Direct and isolated rendering probes
        run: node --test web/presentation-barrier.test.js

      - name: Release build and public payload boundary
        run: |
          cargo build --locked --release
          scripts/bundle
          scripts/check-release-artifacts --bundle "dist/Guild Wars.app"
