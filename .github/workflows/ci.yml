# Every push and every pull request, on the only hardware this project targets.
#
# What this job is for is the things a local `cargo test` on one machine cannot
# notice: a file that was never committed, a formatting or lint rule that this
# machine's toolchain is older or newer than, and a build that only works
# because of something in ~/.cargo. It runs on a clean checkout with nothing
# else on it, which is the whole point.
#
# It has no secrets and enforces a read-only token because it runs on pull
# requests from anywhere. Signing, notarizing and publishing are release.yml's,
# which runs only for a tag and only behind an approval gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a workflow change can be tried without inventing a commit for it.
  workflow_dispatch:

permissions:
  contents: read

# A push to a branch with a pull request open triggers both. The newer run is
# the one anybody cares about, and the older one is holding a macOS runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace is the difference between "a test failed" and knowing where. It
  # costs nothing on a run that passes.
  RUST_BACKTRACE: 1

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GitHub Actions workflows
        # Pin the parser that checks both YAML structure and GitHub expression
        # context availability. A normal PR run cannot schedule an invalid
        # workflow, so it cannot detect this class of failure by itself.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

      - name: REUSE licensing metadata
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6

      - name: Distribution policy
        run: python3 scripts/check-distribution --self-test

  check:
    # Apple Silicon, and the newest image GitHub offers. Both halves matter.
    #
    # arm64 because this project builds one arm64 slice; an Intel runner would
    # be testing a build nobody ships, on a machine nobody runs it on.
    #
    # Newest because the SDK the runner links against is a ceiling on what the
    # code may call, and it should not sit below the SDK on the machine the code
    # is written on — otherwise a symbol that compiles locally fails here for a
    # reason that has nothing to do with the change. Development happens on
    # macOS 27; there is no macOS 27 runner (only a preview Xcode 27 image), so
    # macOS 26 is as close as it gets and the gap is one major version instead
    # of two. Pinned rather than macos-latest, so the day that alias moves is a
    # commit and not a surprise.
    #
    # The floor is not the runner's business: MACOSX_DEPLOYMENT_TARGET and
    # LSMinimumSystemVersion both say 15.2, and a newer SDK does not raise it.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/bundle fills CFBundleVersion from the commit count, and the
          # default shallow checkout would make that 1 on every run — which is
          # harmless here but would quietly become wrong the day anything reads
          # it back.
          fetch-depth: 0

      # rust-toolchain.toml pins the channel, the components and both targets,
      # including the wasm32 one build.rs compiles the companion module for. The
      # runner's preinstalled rustup honours that file, so this step is only
      # making the install happen now rather than inside the first cargo command
      # where its output would be mixed into a build log.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Cargo accepts rust-version as a promise without testing it. Exercise
      # that compiler as well as the newer pinned development toolchain so the
      # declared floor cannot become aspirational.
      - name: Minimum supported Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal \
            --target aarch64-apple-darwin,wasm32-unknown-unknown
          cargo "+$msrv" check --locked --all-targets

      - name: Documentation
        run: python3 scripts/check-docs

      - name: Maintenance scripts
        run: scripts/check-scripts

      - name: Formatting
        run: cargo fmt --all --check

      # Warnings are failures here and nowhere else. Locally a warning is
      # something you read on the way past; on a shared branch it is something
      # that accumulates until nobody reads any of them.
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      # Includes tests/web.rs, which shells out to `node --test` for the page
      # scripts. Node is preinstalled on the macOS runners and the suite has no
      # npm dependencies at all, so there is nothing to install and no lockfile
      # to go stale.
      #
      # The tests that reach api.github.com are #[ignore]d and stay that way: a
      # pull request should not fail because GitHub was rate limiting the
      # runner's shared address.
      - name: Tests
        run: cargo test

      # The release profile is a different compilation — fat LTO, one codegen
      # unit, panic=abort — and it is the one that gets published. A warning
      # that only appears under it, or an LTO failure, should not first be seen
      # by scripts/release.
      - name: Release build
        run: cargo build --release

      # Assembling the bundle is itself something that can break: a plist that
      # no longer substitutes, an icon that was not committed, a file the copy
      # loop stopped matching. Signing is skipped because the runner has no
      # certificate; scripts/bundle says so and carries on, which is what makes
      # this step meaningful without one.
      - name: Bundle
        run: |
          scripts/bundle
          test -f "dist/Guild Wars.app/Contents/Resources/AppIcon.icns"
          test -f "dist/Guild Wars.app/Contents/Resources/LICENSE"
          test -f "dist/Guild Wars.app/Contents/Resources/NOTICE.md"
          test -f "dist/Guild Wars.app/Contents/Resources/THIRD-PARTY-NOTICES.md"
          test -f "dist/Guild Wars.app/Contents/MacOS/gwnative"
          python3 scripts/check-distribution "dist/Guild Wars.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "dist/Guild Wars.app/Contents/Info.plist"
