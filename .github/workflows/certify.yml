name: Client certificate

on:
  #  schedule:
    # ArenaNet exposes no release webhook. The exact official artifact hashes
    # are authoritative, so polling does not depend on a publisher build label.
    # - cron: "17 0 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/certify.yml
      - scripts/client-certify
      - src/wasm/**
      - certificates/builds.json
      - certificates/public-key.txt
  workflow_dispatch:

permissions:
  contents: read

# Never race two monotonic feed updates. A main advance during a run also makes
# the publisher fail closed; the next scheduled run retries from the new head.
concurrency:
  group: client-certificate-main
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    outputs:
      family_id: ${{ steps.generate.outputs.family_id }}
      candidate_sha256: ${{ steps.generate.outputs.candidate_sha256 }}
      needs_publish: ${{ steps.generate.outputs.needs_publish }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Fetch all four official runtime artifacts
        env:
          GWNATIVE_WEB_ROOT: ${{ runner.temp }}/gwnative-client
        run: cargo run --locked --release -- sync

      - name: Generate the deterministic candidate
        id: generate
        continue-on-error: true
        env:
          GWNATIVE_WEB_ROOT: ${{ runner.temp }}/gwnative-client
        run: |
          set -eu
          family_id="$(scripts/client-certify "$GWNATIVE_WEB_ROOT")"
          case "$family_id" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#family_id}" -eq 64
          candidate_sha256="$(shasum -a 256 certificates/builds.candidate.json | cut -d' ' -f1)"
          if cmp -s certificates/builds.json certificates/builds.candidate.json; then
            needs_publish=false
          else
            needs_publish=true
          fi
          {
            echo "family_id=$family_id"
            echo "candidate_sha256=$candidate_sha256"
            echo "needs_publish=$needs_publish"
          } >> "$GITHUB_OUTPUT"

      - name: Verify both transforms and runtime capability gates
        id: verify
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          GWNATIVE_CERTIFY_ROOT: ${{ runner.temp }}/gwnative-client
          GWNATIVE_CERTIFY_JSPI_WASM: ${{ runner.temp }}/gwnative-client/Gw.jspi.wasm
          GWNATIVE_CERTIFY_JSPI_GLUE: ${{ runner.temp }}/gwnative-client/Gw.jspi.js
          GWNATIVE_CERTIFY_ASYNCIFY_WASM: ${{ runner.temp }}/gwnative-client/Gw.wasm
          GWNATIVE_CERTIFY_ASYNCIFY_GLUE: ${{ runner.temp }}/gwnative-client/Gw.js
          GWNATIVE_CERTIFY_FEED: ${{ github.workspace }}/certificates/builds.candidate.json
        run: |
          cargo test wasm::tests::external_ -- --nocapture
          node --test web/enhancements.test.js web/companion-snapshot.test.js

      - name: Report the candidate
        if: steps.generate.outcome == 'success' && steps.verify.outcome == 'success'
        continue-on-error: true
        env:
          FAMILY_ID: ${{ steps.generate.outputs.family_id }}
        run: |
          passive="$(jq -r --arg family_id "$FAMILY_ID" \
            '.families[] | select(.familyId == $family_id) | if all(.runtimes[]; .passiveEnhancements) then "eligible" else "disabled" end' \
            certificates/builds.candidate.json)"
          {
            echo "### Automatic client certificate"
            echo
            echo "Artifact family: \`$FAMILY_ID\`"
            echo "Candidate SHA-256: \`${{ steps.generate.outputs.candidate_sha256 }}\`"
            echo "Publication required: \`${{ steps.generate.outputs.needs_publish }}\`"
            echo "Passive observer: \`$passive\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report a candidate that needs transformer review
        if: steps.generate.outcome == 'failure' || steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="cert(client): automatic candidate needs transformer review"
          existing="$(gh issue list --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          body="The official client artifacts no longer satisfy the compiled semantic anchors. Nothing was signed or published. Players still receive the unmodified official client; only uncertified optional features stay disabled. Failed scan: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close a resolved transformer-review issue
        if: steps.generate.outcome == 'success' && steps.verify.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="cert(client): automatic candidate needs transformer review"
          existing="$(gh issue list --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "The automatic candidate satisfies the reviewed anchors again."
          fi

      - name: Fail when no safe candidate can be generated
        if: steps.generate.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: exit 1

  reproduce:
    if: needs.candidate.outputs.needs_publish == 'true'
    needs: candidate
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      EXPECTED_FAMILY_ID: ${{ needs.candidate.outputs.family_id }}
      EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.candidate_sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Fetch all four official runtime artifacts again
        env:
          GWNATIVE_WEB_ROOT: ${{ runner.temp }}/gwnative-client
        run: cargo run --locked --release -- sync

      - name: Reproduce the exact candidate
        env:
          GWNATIVE_WEB_ROOT: ${{ runner.temp }}/gwnative-client
        run: |
          set -eu
          actual_family_id="$(scripts/client-certify "$GWNATIVE_WEB_ROOT")"
          test "$actual_family_id" = "$EXPECTED_FAMILY_ID"
          actual_sha256="$(shasum -a 256 certificates/builds.candidate.json | cut -d' ' -f1)"
          test "$actual_sha256" = "$EXPECTED_CANDIDATE_SHA256"

      - name: Repeat both transform and runtime-gate tests
        env:
          GWNATIVE_CERTIFY_ROOT: ${{ runner.temp }}/gwnative-client
          GWNATIVE_CERTIFY_JSPI_WASM: ${{ runner.temp }}/gwnative-client/Gw.jspi.wasm
          GWNATIVE_CERTIFY_JSPI_GLUE: ${{ runner.temp }}/gwnative-client/Gw.jspi.js
          GWNATIVE_CERTIFY_ASYNCIFY_WASM: ${{ runner.temp }}/gwnative-client/Gw.wasm
          GWNATIVE_CERTIFY_ASYNCIFY_GLUE: ${{ runner.temp }}/gwnative-client/Gw.js
          GWNATIVE_CERTIFY_FEED: ${{ github.workspace }}/certificates/builds.candidate.json
        run: |
          cargo test wasm::tests::external_ -- --nocapture
          node --test web/enhancements.test.js web/companion-snapshot.test.js

      - name: Hand the reproduced feed to the isolated signer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-certificate-feed
          path: certificates/builds.candidate.json
          if-no-files-found: error
          retention-days: 7

  validate:
    if: needs.candidate.outputs.needs_publish == 'true'
    needs: [candidate, reproduce]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      EXPECTED_FAMILY_ID: ${{ needs.candidate.outputs.family_id }}
      EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.candidate_sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download only the reproduced data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-certificate-feed
          path: ${{ runner.temp }}/unsigned

      - name: Validate the closed schema and exact feed transition
        run: |
          set -eu
          python3 scripts/check-trust-policy validate-transition \
            certificates/builds.json \
            "$RUNNER_TEMP/unsigned/builds.candidate.json" \
            "$EXPECTED_FAMILY_ID" "$EXPECTED_CANDIDATE_SHA256"

      - name: Hand only validated data to the isolated signer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-certificate-feed
          path: ${{ runner.temp }}/unsigned/builds.candidate.json
          if-no-files-found: error
          retention-days: 7

  reserve:
    if: needs.candidate.outputs.needs_publish == 'true'
    needs: [candidate, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.reserve.outputs.branch }}
      needs_sign: ${{ steps.reserve.outputs.needs_sign }}
    env:
      EXPECTED_BASE_SHA: ${{ github.sha }}
      EXPECTED_FAMILY_ID: ${{ needs.candidate.outputs.family_id }}
      EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.candidate_sha256 }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download only the validated data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-certificate-feed
          path: ${{ runner.temp }}/validated

      - name: Reserve one digest for the next sequence
        id: reserve
        run: |
          set -eu
          feed="$RUNNER_TEMP/validated/builds.candidate.json"
          python3 scripts/check-trust-policy validate-transition \
            certificates/builds.json "$feed" \
            "$EXPECTED_FAMILY_ID" "$EXPECTED_CANDIDATE_SHA256"
          sequence="$(jq -r '.sequence' "$feed")"
          branch="certificates/sequence-$sequence-$EXPECTED_CANDIDATE_SHA256"
          reservation_ref="refs/heads/certificate-reservations/sequence-$sequence"
          remote_sha="$(git ls-remote --heads origin "$reservation_ref" | cut -f1)"
          if [ -z "$remote_sha" ]; then
            reservation="$RUNNER_TEMP/reservation.json"
            jq -n --argjson sequence "$sequence" \
              --arg candidate "$EXPECTED_CANDIDATE_SHA256" \
              --arg family "$EXPECTED_FAMILY_ID" --arg base "$EXPECTED_BASE_SHA" \
              '{sequence:$sequence,candidateSha256:$candidate,familyId:$family,baseSha:$base}' \
              > "$reservation"
            blob="$(git hash-object -w "$reservation")"
            tree="$(printf '100644 blob %s\treservation.json\n' "$blob" | git mktree)"
            date="$(git show -s --format=%aI "$EXPECTED_BASE_SHA")"
            commit="$(printf 'Reserve certificate sequence %s\n' "$sequence" | \
              GIT_AUTHOR_NAME=github-actions GIT_AUTHOR_EMAIL=github-actions@github.com \
              GIT_COMMITTER_NAME=github-actions GIT_COMMITTER_EMAIL=github-actions@github.com \
              GIT_AUTHOR_DATE="$date" GIT_COMMITTER_DATE="$date" \
              git -c commit.gpgsign=false commit-tree "$tree" -p "$EXPECTED_BASE_SHA")"
            git push origin "$commit:$reservation_ref" || true
            remote_sha="$(git ls-remote --heads origin "$reservation_ref" | cut -f1)"
          fi
          test -n "$remote_sha"
          git fetch --no-tags origin "$reservation_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$remote_sha"
          git show "$remote_sha:reservation.json" > "$RUNNER_TEMP/reserved.json"
          test "$(jq -r '.sequence' "$RUNNER_TEMP/reserved.json")" = "$sequence"
          test "$(jq -r '.candidateSha256' "$RUNNER_TEMP/reserved.json")" = "$EXPECTED_CANDIDATE_SHA256"
          test "$(jq -r '.familyId' "$RUNNER_TEMP/reserved.json")" = "$EXPECTED_FAMILY_ID"
          reserved_base="$(jq -r '.baseSha' "$RUNNER_TEMP/reserved.json")"
          test "$(git rev-parse "$remote_sha^")" = "$reserved_base"
          git merge-base --is-ancestor "$reserved_base" "$EXPECTED_BASE_SHA"
          git show "$reserved_base:certificates/builds.json" > "$RUNNER_TEMP/reserved-base.json"
          cmp "$RUNNER_TEMP/reserved-base.json" certificates/builds.json

          published="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          if [ -z "$published" ]; then
            needs_sign=true
          else
            git fetch --no-tags origin "refs/heads/$branch"
            test "$(git rev-parse FETCH_HEAD)" = "$published"
            scripts/check-trust-policy check-publish "$reserved_base" "$published"
            git show "$published:certificates/builds.json" > "$RUNNER_TEMP/published.json"
            git show "$published:certificates/builds.json.sig" > "$RUNNER_TEMP/published.json.sig"
            cmp "$feed" "$RUNNER_TEMP/published.json"
            { printf '302a300506032b6570032100' | xxd -r -p; openssl base64 -d -A < certificates/public-key.txt; } > "$RUNNER_TEMP/public.der"
            openssl base64 -d -A -in "$RUNNER_TEMP/published.json.sig" -out "$RUNNER_TEMP/published.sig"
            openssl pkeyutl -verify -pubin -keyform DER -inkey "$RUNNER_TEMP/public.der" \
              -rawin -in "$RUNNER_TEMP/published.json" -sigfile "$RUNNER_TEMP/published.sig"
            open="$(gh pr list --state open --base main --head "$branch" --json number --jq '.[].number')"
            test "$(printf '%s\n' "$open" | sed '/^$/d' | wc -l)" -le 1
            if [ -z "$open" ]; then
              closed="$(gh pr list --state closed --base main --head "$branch" --limit 1 --json number --jq '.[0].number // empty')"
              if [ -n "$closed" ]; then
                gh pr reopen "$closed"
                gh pr ready --undo "$closed" || true
              else
                short_id="${EXPECTED_FAMILY_ID:0:12}"
                gh pr create --draft --base main --head "$branch" \
                  --title "cert(client): support artifact family $short_id" \
                  --body "Restart-safe recovery of an independently reproduced, signed certificate proposal. This draft changes only the signed certificate feed pair. Review CODEOWNERS paths and required CI before merge; a write user must approve the pending bot-triggered CI run."
              fi
            fi
            needs_sign=false
          fi
          {
            echo "branch=$branch"
            echo "needs_sign=$needs_sign"
          } >> "$GITHUB_OUTPUT"

  sign:
    if: needs.reserve.outputs.needs_sign == 'true'
    needs: [candidate, validate, reserve]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: certificate-publishing
    permissions:
      actions: read
      contents: read
    env:
      EXPECTED_FAMILY_ID: ${{ needs.candidate.outputs.family_id }}
      EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.candidate_sha256 }}
      CERTIFICATE_PUBLIC_KEY: Uo9sqXxlPVzozJ/kiUVIiiLGkMlqvnuh8Y3Iz6Yge5k=

    steps:
      - name: Download only the reproduced data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-certificate-feed
          path: ${{ runner.temp }}/validated

      - name: Bound and freeze the validated signing input
        run: |
          set -eu
          feed="$RUNNER_TEMP/validated/builds.candidate.json"
          test -f "$feed" && test ! -L "$feed"
          test "$(find "$RUNNER_TEMP/validated" -mindepth 1 -maxdepth 1 -printf '%f\n')" = builds.candidate.json
          test "$(stat -c %s "$feed")" -le 4194304
          test "$(sha256sum "$feed" | cut -d' ' -f1)" = "$EXPECTED_CANDIDATE_SHA256"
          work="$RUNNER_TEMP/signing"
          mkdir -p "$work"
          cp "$feed" "$work/builds.json"
          chmod 0444 "$work/builds.json"
          {
            printf '302a300506032b6570032100' | xxd -r -p
            printf '%s' "$CERTIFICATE_PUBLIC_KEY" | openssl base64 -d -A
          } > "$work/public.der"

      # The key exists only in this step. There is no checkout in this job, and
      # this step invokes only fixed runner/OpenSSL commands over frozen data.
      - name: Sign with the dedicated certificate key
        env:
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          set -eu
          work="$RUNNER_TEMP/signing"
          private="$work/private.der"
          trap 'rm -f "$private"' EXIT INT TERM
          umask 077
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -d -A > "$private"
          chmod 600 "$private"

          openssl pkey -inform DER -in "$private" -pubout -outform DER \
            -out "$work/public.der"
          actual_public="$(tail -c 32 "$work/public.der" | openssl base64 -A)"
          test "$actual_public" = "$CERTIFICATE_PUBLIC_KEY"

          openssl pkeyutl -sign -rawin -keyform DER -inkey "$private" \
            -in "$work/builds.json" -out "$work/signature.raw"
          openssl base64 -A -in "$work/signature.raw" > "$work/builds.json.sig"
          printf '\n' >> "$work/builds.json.sig"
          openssl pkeyutl -verify -pubin -keyform DER -inkey "$work/public.der" \
            -rawin -in "$work/builds.json" -sigfile "$work/signature.raw"

      - name: Hand off the signed, verified pair
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-certificate-feed
          path: |
            ${{ runner.temp }}/signing/builds.json
            ${{ runner.temp }}/signing/builds.json.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    if: always() && needs.reserve.outputs.needs_sign == 'true' && needs.sign.result == 'success'
    needs: [candidate, reserve, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      EXPECTED_BASE_SHA: ${{ github.sha }}
      EXPECTED_FAMILY_ID: ${{ needs.candidate.outputs.family_id }}
      EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.candidate_sha256 }}
      PUBLICATION_BRANCH: ${{ needs.reserve.outputs.branch }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download the signed feed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-certificate-feed
          path: ${{ runner.temp }}/signed

      - name: Verify and propose only the monotonic signed feed
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          signed="$RUNNER_TEMP/signed"
          test -f "$signed/builds.json" && test ! -L "$signed/builds.json"
          test -f "$signed/builds.json.sig" && test ! -L "$signed/builds.json.sig"
          test "$(find "$signed" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)" = "$(printf '%s\n%s' builds.json builds.json.sig)"
          test "$(stat -c %s "$signed/builds.json")" -le 4194304
          test "$(stat -c %s "$signed/builds.json.sig")" -le 256
          test "$(sha256sum "$signed/builds.json" | cut -d' ' -f1)" = "$EXPECTED_CANDIDATE_SHA256"

          work="$RUNNER_TEMP/public-key"
          mkdir -p "$work"
          {
            printf '302a300506032b6570032100' | xxd -r -p
            openssl base64 -d -A < certificates/public-key.txt
          } > "$work/public.der"
          openssl base64 -d -A -in "$signed/builds.json.sig" \
            -out "$work/signature.raw"
          openssl pkeyutl -verify -pubin -keyform DER -inkey "$work/public.der" \
            -rawin -in "$signed/builds.json" -sigfile "$work/signature.raw"

          old_sequence="$(jq -r '.sequence' certificates/builds.json)"
          new_sequence="$(jq -r '.sequence' "$signed/builds.json")"
          test "$new_sequence" -eq "$((old_sequence + 1))"
          jq -e --arg family_id "$EXPECTED_FAMILY_ID" \
            'any(.families[]; .familyId == $family_id)' \
            "$signed/builds.json" >/dev/null

          cp "$signed/builds.json" certificates/builds.json
          cp "$signed/builds.json.sig" certificates/builds.json.sig
          git add certificates/builds.json certificates/builds.json.sig
          changed="$(git diff --cached --name-only)"
          test "$changed" = "$(printf '%s\n%s' \
            certificates/builds.json certificates/builds.json.sig)"

          short_id="${EXPECTED_FAMILY_ID:0:12}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "cert(client): support artifact family $short_id"
          scripts/check-trust-policy check-publish "$EXPECTED_BASE_SHA" HEAD

          branch="$PUBLICATION_BRANCH"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "cert(client): support artifact family $short_id" \
            --body "Automated, independently reproduced certificate update. This draft changes only the signed certificate feed pair, advances sequence $old_sequence to $new_sequence, and keeps unknown artifacts on untouched official bytes with optional features disabled. Review both CODEOWNERS paths and required CI before merge. Because GitHub holds workflows triggered by GITHUB_TOKEN pull requests, a write user must approve the pending CI run."

          {
            echo "### Draft certificate pull request opened"
            echo
            echo "Signed feed sequence \`$new_sequence\` proposes support for \`$EXPECTED_FAMILY_ID\`."
            echo "Nothing reaches main until the draft passes review and required CI."
          } >> "$GITHUB_STEP_SUMMARY"
